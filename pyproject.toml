[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-pipeline"
version = "0.1.0"
description = "A vulnerability API with a DevSecOps pipeline"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]